name: meteocool

options:
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

# Project-level xcconfigs. Base.xcconfig optionally includes a gitignored
# Local.xcconfig so signing identity never has to live in the repo.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

fileGroups:
  - project.yml
  - CLAUDE.md
  - README.md
  - Config
  - scripts
  - fastlane

attributes:
  ORGANIZATIONNAME: meteocool

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_MODULE_VERIFIER: NO

targets:
  meteocool:
    type: application
    platform: iOS
    sources:
      - path: meteocool
        excludes:
          - "**/.DS_Store"
          - "*.xcloc"
          - "**/*.xcloc/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool
        INFOPLIST_FILE: meteocool/Info.plist
        CODE_SIGN_ENTITLEMENTS: meteocool/meteocool.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      # Main.storyboard instantiates WKWebView by name, so WebKit has to be
      # linked explicitly — Swift's autolinking from `import WebKit` alone does
      # not put it in the binary, and the app crashes on launch without it.
      - sdk: WebKit.framework
      # CarPlay is only reached from Swift, but linking it explicitly keeps it
      # beside WebKit rather than relying on autolinking for the car screen.
      - sdk: CarPlay.framework
      - target: NotificationService
    scheme:
      testTargets:
        - meteocoolUITests
      gatherCoverageData: false

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool.NotificationService2
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  meteocoolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: meteocoolUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocoolUITests
        INFOPLIST_FILE: meteocoolUITests/Info.plist
        TEST_TARGET_NAME: meteocool
        # SnapshotHelper.swift is vendored verbatim from fastlane and is
        # regenerated by `fastlane snapshot`; it is not Swift 6 clean, so this
        # target stays in Swift 5 language mode rather than carrying local
        # patches that the next fastlane update would clobber.
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: meteocool
