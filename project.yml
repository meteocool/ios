name: meteocool

options:
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

# Project-level xcconfigs. Base.xcconfig includes the optional, gitignored
# Local.xcconfig, which holds the signing identity outside the repo.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

fileGroups:
  - project.yml
  - README.md
  - Config
  - scripts

attributes:
  ORGANIZATIONNAME: meteocool

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_MODULE_VERIFIER: NO

targets:
  meteocool:
    type: application
    platform: iOS
    sources:
      - path: meteocool
        excludes:
          - "**/.DS_Store"
          - "*.xcloc"
          - "**/*.xcloc/**"
      # The Live Activity's content state and radar image, shared with
      # the RainActivity extension that draws it.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool
        INFOPLIST_FILE: meteocool/Info.plist
        CODE_SIGN_ENTITLEMENTS: meteocool/meteocool.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      # WebKit must be linked explicitly: Main.storyboard instantiates
      # WKWebView by name, and autolinking from `import WebKit` does not put
      # WebKit in the binary. Without this line the app crashes on launch.
      - sdk: WebKit.framework
      # CarPlay is used only from Swift. It is linked explicitly anyway, the
      # same way as WebKit, instead of relying on autolinking.
      - sdk: CarPlay.framework
      # The AR storm view (meteocool/AR), linked explicitly for the same
      # reason. Every device iOS 18 runs on has the frameworks; whether AR
      # works is decided at run time by ARWorldTrackingConfiguration.isSupported,
      # and no device capability is required, so every phone still installs.
      - sdk: ARKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreMotion.framework
      # The share sheet's link preview (ViewController's MapLinkItem), linked
      # explicitly like the rest.
      - sdk: LinkPresentation.framework
      # The rain Live Activity: started, updated and ended by the app
      # (LiveActivityManager) or over APNs, drawn by RainActivity.
      - sdk: ActivityKit.framework
      # Reloads the widgets when the location or a setting they show changes.
      - sdk: WidgetKit.framework
      - target: NotificationService
      - target: RainActivity
    scheme:
      testTargets:
        - meteocoolUITests
      gatherCoverageData: false

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool.NotificationService
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  # Draws the rain Live Activity (lock screen and Dynamic Island) and the
  # home and lock screen widgets (RainActivity/Widgets). A Live Activity
  # cannot use the network, so its radar image reaches it as a file in the
  # app group (Shared/RadarImageStore.swift); the widgets fetch their own.
  RainActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RainActivity
        excludes:
          - "**/.DS_Store"
      - path: Shared
      # The radar palettes, generated from core for the AR view.
      - path: meteocool/AR/Colormaps.swift
      # The widgets ask the API of the deployment the app is set to.
      - path: meteocool/lib/Environment.swift
      - path: meteocool/lib/NetworkHelper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool.RainActivity
        INFOPLIST_FILE: RainActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: RainActivity/RainActivity.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
      # The widgets: their settings, place search and location.
      - sdk: AppIntents.framework
      - sdk: MapKit.framework
      - sdk: CoreLocation.framework

  meteocoolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: meteocoolUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocoolUITests
        INFOPLIST_FILE: meteocoolUITests/Info.plist
        TEST_TARGET_NAME: meteocool
        # Swift 5 language mode: XCUIApplication is main-actor isolated, and
        # the tests keep it in stored properties, which Swift 6 refuses.
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: meteocool
