name: meteocool

options:
  minimumXcodeGenVersion: "2.42.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false
  deploymentTarget:
    iOS: "18.0"

configs:
  Debug: debug
  Release: release

# Project-level xcconfigs. Base.xcconfig includes the optional, gitignored
# Local.xcconfig, which holds the signing identity outside the repo.
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

fileGroups:
  - project.yml
  - README.md
  - Config
  - scripts
  - fastlane

attributes:
  ORGANIZATIONNAME: meteocool

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_MODULES: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
    ENABLE_MODULE_VERIFIER: NO

targets:
  meteocool:
    type: application
    platform: iOS
    sources:
      - path: meteocool
        excludes:
          - "**/.DS_Store"
          - "*.xcloc"
          - "**/*.xcloc/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool
        INFOPLIST_FILE: meteocool/Info.plist
        CODE_SIGN_ENTITLEMENTS: meteocool/meteocool.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
    dependencies:
      # WebKit must be linked explicitly: Main.storyboard instantiates
      # WKWebView by name, and autolinking from `import WebKit` does not put
      # WebKit in the binary. Without this line the app crashes on launch.
      - sdk: WebKit.framework
      # CarPlay is used only from Swift. It is linked explicitly anyway, the
      # same way as WebKit, instead of relying on autolinking.
      - sdk: CarPlay.framework
      - target: NotificationService
    scheme:
      testTargets:
        - meteocoolUITests
      gatherCoverageData: false

  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: NotificationService
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocool.NotificationService2
        INFOPLIST_FILE: NotificationService/Info.plist
        CODE_SIGN_ENTITLEMENTS: NotificationService/NotificationService.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"

  meteocoolUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: meteocoolUITests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_PREFIX).meteocoolUITests
        INFOPLIST_FILE: meteocoolUITests/Info.plist
        TEST_TARGET_NAME: meteocool
        # Swift 5 language mode, because SnapshotHelper.swift does not compile
        # cleanly in Swift 6. The file is copied unchanged from fastlane and
        # `fastlane snapshot` regenerates it, so local patches would be
        # overwritten by the next fastlane update.
        SWIFT_VERSION: "5.0"
    dependencies:
      - target: meteocool
